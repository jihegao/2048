name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run format:check
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:worker
      - run: npm run build
      - name: Verify migration controls with synthetic data only
        run: |
          node scripts/migration-deployment-targets.mjs
          node --test tests/migration-tools/*.test.mjs
          npx tsc --project tsconfig.migration.json --noEmit
          npx tsc --project tsconfig.migration-freeze.json --noEmit
          npx vitest run --config vitest.migration.config.ts
          npx vitest run --config vitest.migration-freeze.config.ts
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  approved-original-key-verification:
    # Temporary approved operation: only this same-repository preparation PR.
    # Secrets are passed solely to code pinned before this trigger was added.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 42 && github.event.pull_request.head.repo.full_name == 'jihegao/2048' && github.head_ref == 'codex/data-preserving-migration-prep' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: 2048-approved-original-key-verification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6c9af49b4c48af3c039b72c33fe2ab55f2d578fa
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require the reviewed immutable source-check package
        run: |
          test "$(git rev-parse HEAD)" = 6c9af49b4c48af3c039b72c33fe2ab55f2d578fa
          node scripts/migration-deployment-targets.mjs
          node --test tests/migration-tools/*.test.mjs
      - name: Enable approved OLD read-only check and verify original keys
        env:
          APPROVED_SOURCE_VERIFICATION: 'true'
          CF_2048_OLD_SOURCE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOOTSTRAP_TEACHER_USERNAME: ${{ secrets.BOOTSTRAP_TEACHER_USERNAME }}
          BOOTSTRAP_TEACHER_PASSWORD: ${{ secrets.BOOTSTRAP_TEACHER_PASSWORD }}
          BOOTSTRAP_TEACHER_NAME: ${{ secrets.BOOTSTRAP_TEACHER_NAME }}
          INITIAL_STUDENT_PASSWORD: ${{ secrets.INITIAL_STUDENT_PASSWORD }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          PRACTICE_SIGNING_KEY: ${{ secrets.PRACTICE_SIGNING_KEY }}
          IMPORT_SIGNING_KEY: ${{ secrets.IMPORT_SIGNING_KEY }}
        run: node scripts/migration-source-key-verification.mjs
