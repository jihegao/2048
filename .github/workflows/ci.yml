name: 2048 approved OLD frozen actor verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: 2048-approved-old-frozen-verification
  cancel-in-progress: false
jobs:
  old-frozen-actor-verification:
    if: ${{ github.event.pull_request.number == 42 && github.head_ref == 'codex/data-preserving-migration-prep' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 21bbe4af4b6f2aa536348008628935fc24da4e23
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify all OLD objects after verified natural drain and full maintenance deployment
        env:
          CF_2048_OLD_SOURCE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMPORT_SIGNING_KEY: ${{ secrets.IMPORT_SIGNING_KEY }}
          EXPECTED_FROZEN_VERSION: 46c2f74d-0512-45cc-af30-e496a32f93b0
          CONFIRMED_MAINTENANCE_WINDOW: 'true'
          VERIFIED_DRAIN_COMPLETE: 'true'
        run: node scripts/migration-object-quiescence.mjs verify-frozen old
