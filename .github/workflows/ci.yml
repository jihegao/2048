name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run format:check
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:worker
      - run: npm run build
      - name: Verify migration controls with synthetic data only
        run: |
          node scripts/migration-deployment-targets.mjs
          node --test tests/migration-tools/*.test.mjs
          npx tsc --project tsconfig.migration.json --noEmit
          npx tsc --project tsconfig.migration-freeze.json --noEmit
          npx vitest run --config vitest.migration.config.ts
          npx vitest run --config vitest.migration-freeze.config.ts
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  new-credential-availability:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 42 && github.event.pull_request.head.repo.full_name == 'jihegao/2048' && github.head_ref == 'codex/data-preserving-migration-prep' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check only whether the approved dedicated encrypted secret has been saved
        env:
          CF_2048_NEW_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
        run: node --input-type=module -e 'console.log(JSON.stringify({dedicated_new_deploy_token_present: Boolean(process.env.CF_2048_NEW_TOKEN)}))'
