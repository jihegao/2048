name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run format:check
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:worker
      - run: npm run build
      - name: Verify migration controls with synthetic data only
        run: |
          node scripts/migration-deployment-targets.mjs
          node --test tests/migration-tools/*.test.mjs
          python3 -m unittest discover -s tests/migration-tools -p 'test_*.py' -v
          npx tsc --project tsconfig.migration.json --noEmit
          npx tsc --project tsconfig.migration-freeze.json --noEmit
          npx vitest run --config vitest.migration.config.ts
          npx vitest run --config vitest.migration-freeze.config.ts
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
