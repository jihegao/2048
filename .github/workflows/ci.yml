name: 2048 exact final production artifact preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  build-approved-final:
    if: ${{ github.event.pull_request.number == 42 && github.head_ref == 'codex/data-preserving-migration-prep' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: db1bc654501dcad3414a8d8218b9df33457359dc
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run build
      - run: npx wrangler deploy --config wrangler.new-production.jsonc --dry-run --outdir .migration-final-artifact
      - name: Record exact module and asset digests without publishing
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const module=fs.readFileSync('.migration-final-artifact/index.js');
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(dir,e.name)):[path.join(dir,e.name)]);
          const assets=walk('dist').sort().map(p=>[p.slice(5),hash(fs.readFileSync(p))]);
          assert.ok(assets.length>0);assert.ok(!module.toString().includes('/api/teacher/_migration/rearm-waiting'));
          console.log(JSON.stringify({final_production_artifact_prepared:true,source_commit:'db1bc654501dcad3414a8d8218b9df33457359dc',module_bytes:module.length,module_sha256:hash(module),assets_sha256:hash(JSON.stringify(assets)),asset_files:assets.length,deployed:false,business_open:false}));
          NODE
