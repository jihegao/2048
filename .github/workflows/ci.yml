name: 2048 approved OLD frozen actor verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: 2048-approved-old-frozen-verification
  cancel-in-progress: true
jobs:
  old-frozen-actor-verification:
    if: ${{ github.event.pull_request.number == 42 && github.head_ref == 'codex/data-preserving-migration-prep' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9434c936898e7232dc66b8368b04c8bd6a23512f
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Add safe assertion location diagnostics without exception details
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='scripts/migration-object-quiescence.mjs';
          let code=fs.readFileSync(file,'utf8');
          const anchor='main().catch(() => {';
          if(!code.includes(anchor))process.exit(1);
          code=code.replace(anchor, 'main().catch((error) => { console.error(JSON.stringify({safe_failure_location: String(error.stack ?? "").match(/migration-object-quiescence\\.mjs:\\d+:\\d+/)?.[0] ?? "unavailable", assertion_error: error.name === "AssertionError"}));');
          fs.writeFileSync(file,code);
          NODE
      - name: Verify all OLD objects after verified natural drain and full maintenance deployment
        env:
          CF_2048_OLD_SOURCE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMPORT_SIGNING_KEY: ${{ secrets.IMPORT_SIGNING_KEY }}
          EXPECTED_FROZEN_VERSION: 7f57e5ed-ffae-44db-a1b5-3d4625231bea
          CONFIRMED_MAINTENANCE_WINDOW: 'true'
          VERIFIED_DRAIN_COMPLETE: 'true'
        run: node scripts/migration-object-quiescence.mjs verify-frozen old
