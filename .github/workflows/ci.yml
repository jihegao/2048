name: 2048 approved NEW actor verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: 2048-approved-new-actor-verification
  cancel-in-progress: false
jobs:
  verify-new-actors:
    if: ${{ github.event.pull_request.number == 42 && github.head_ref == 'codex/data-preserving-migration-prep' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
      IMPORT_SIGNING_KEY: ${{ secrets.IMPORT_SIGNING_KEY }}
      CONFIRMED_MAINTENANCE_WINDOW: 'true'
      VERIFIED_DRAIN_COMPLETE: 'true'
      EXPECTED_FROZEN_VERSION: af6d5068-c967-4d6f-8b51-cb7d34d2874a
    steps:
      - uses: actions/checkout@v7
        with:
          ref: db1bc654501dcad3414a8d8218b9df33457359dc
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify all actors twice with bounded convergence retries
        run: |
          cat > migration-safe-fetch-monitor.mjs <<'MONITOR'
          const originalFetch=globalThis.fetch;
          globalThis.fetch=async (...args)=>{
            const response=await originalFetch(...args);
            if(response.status!==200){
              const path=new URL(args[0]).pathname;
              const operation=path.includes('/namespaces/')?'namespace_inventory':path.includes('/objects/probe')?'frozen_actor_probe':path.includes('/settings')?'worker_settings':'worker_identity';
              console.log(JSON.stringify({quiescence_http_failure:operation,status:response.status}));
            }
            return response;
          };
          MONITOR
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          let ok=false;
          for(let n=0;n<6&&!ok;n++){
            const child=spawnSync(process.execPath,['--import','./migration-safe-fetch-monitor.mjs','scripts/migration-object-quiescence.mjs','verify-frozen','new'],{env:process.env,encoding:'utf8'});
            process.stdout.write(child.stdout??'');process.stderr.write(child.stderr??'');
            const summaries=(child.stdout??'').split('\n').flatMap(line=>{try{return [JSON.parse(line)];}catch{return [];}});
            const proof=summaries.find(x=>x.stable_inventory===true);
            ok=child.status===0&&proof?.inventory?.room?.stored>=10&&proof?.inventory?.['login-guard']?.stored>=29;
            if(!ok){console.log(JSON.stringify({all_known_recent_objects_in_catalog:false,attempt:n+1}));await new Promise(r=>setTimeout(r,10000));}
          }
          if(!ok)process.exitCode=1;
          NODE
