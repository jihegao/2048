name: 2048 final CLOSED data acceptance
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: 2048-final-closed-data-acceptance
  cancel-in-progress: false
jobs:
  deploy-closed-new:
    if: ${{ github.event.pull_request.number == 42 && github.head_ref == 'codex/data-preserving-migration-prep' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_2048_OLD_SOURCE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3232ebc7e9bb0199b92e3d70b07825af
      PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
      PRACTICE_SIGNING_KEY: ${{ secrets.PRACTICE_SIGNING_KEY }}
      IMPORT_SIGNING_KEY: ${{ secrets.IMPORT_SIGNING_KEY }}
      INITIAL_STUDENT_PASSWORD: ${{ secrets.INITIAL_STUDENT_PASSWORD }}
      BOOTSTRAP_TEACHER_USERNAME: ${{ secrets.BOOTSTRAP_TEACHER_USERNAME }}
      BOOTSTRAP_TEACHER_PASSWORD: ${{ secrets.BOOTSTRAP_TEACHER_PASSWORD }}
      BOOTSTRAP_TEACHER_NAME: ${{ secrets.BOOTSTRAP_TEACHER_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: db1bc654501dcad3414a8d8218b9df33457359dc
      - uses: actions/checkout@v7
        with:
          ref: 5e0664b04226487beadadd122805236179129035
          path: gate-evidence
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Recheck frozen OLD and wait for final login safety bound
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {checkCandidate} from './scripts/check-migration-targets.mjs';
          const api=async(method,path,body)=>{const r=await fetch('https://api.cloudflare.com/client/v4'+path,{method,headers:{Authorization:'Bearer '+process.env.CF_2048_OLD_SOURCE_TOKEN,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),redirect:'error',signal:AbortSignal.timeout(20000)});assert.equal(r.status,200);const d=await r.json();assert.equal(d.success,true);return d.result;};
          try {
            const state=JSON.parse(fs.readFileSync('gate-evidence/operations/migration-release-state.json','utf8'));
            const bound=Date.parse(state.login_guard_safe_not_before);
            assert.ok(Number.isFinite(bound));assert.ok(bound<Date.parse(state.confirmed_maintenance_window.end));
            while(Date.now()<bound)await new Promise(r=>setTimeout(r,Math.min(5000,bound-Date.now())));
            const base='/accounts/8b0d70250211aa10d89e20605a1c7e5e/workers/scripts/2048-challenge-platform';
            assert.deepEqual((await api('GET',base+'/deployments')).deployments[0].versions,[{version_id:'7f57e5ed-ffae-44db-a1b5-3d4625231bea',percentage:100}]);
            assert.deepEqual((await api('GET',base+'/schedules')).schedules,[]);
            assert.deepEqual(await api('GET',base+'/subdomain'),{enabled:false,previews_enabled:false});
            const rows=await api('POST','/accounts/8b0d70250211aa10d89e20605a1c7e5e/d1/database/4598bd98-f338-4f8b-9db7-b5b399d698f5/query',{sql:"SELECT phase,epoch FROM __2048_write_fence; SELECT COUNT(*) AS active FROM timed_practice_sessions WHERE status='active'; SELECT COUNT(*) AS active FROM rooms WHERE status IN ('countdown','live','settling')"});
            assert.ok(rows.every(x=>x.success&&x.meta.rows_written===0));assert.deepEqual(rows[0].results,[{phase:'frozen',epoch:8}]);assert.equal(rows[1].results[0].active,0);assert.equal(rows[2].results[0].active,0);
            const publicResponse=await fetch('https://2048.gaojihe.cn/api/health',{redirect:'error',signal:AbortSignal.timeout(20000)});assert.equal(publicResponse.status,503);assert.equal(publicResponse.headers.get('set-cookie'),null);
            state.gates.login_guard_window_elapsed=true;checkCandidate(state);fs.writeFileSync('operations/migration-release-state.json',JSON.stringify(state));
            console.log(JSON.stringify({source_still_frozen:true,final_login_window_elapsed:true,first_nine_candidate_gates_passed:true,checked_at:new Date().toISOString()}));
          } catch {console.error('Closed deployment preflight stopped; no secret or response details logged');process.exitCode=1;}
          NODE
      - name: Build exact tested application and deploy only approved CLOSED NEW target
        run: |
          npm run cf-typegen
          npm run build
          node scripts/check-migration-targets.mjs --require-candidate-ready
          npx wrangler deploy --config wrangler.new-candidate.jsonc --keep-vars
      - name: Verify closed NEW identity and original seven keys
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {secretNames,buildProof} from './scripts/migration-runtime-key-handoff.mjs';
          const api=async(path)=>{const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},redirect:'error',signal:AbortSignal.timeout(20000)});assert.equal(r.status,200);const d=await r.json();assert.equal(d.success,true);return d.result;};
          try {
            const base='/accounts/3232ebc7e9bb0199b92e3d70b07825af/workers/scripts/2048-challenge-platform';
            const versions=(await api(base+'/deployments')).deployments[0].versions;assert.equal(versions.length,1);assert.equal(versions[0].percentage,100);
            const settings=await api(base+'/settings');const binding=n=>settings.bindings.find(x=>x.name===n);
            assert.equal(binding('DB').id,'d46a430b-4c22-469b-9af0-61b41b88e914');assert.equal(binding('ROOMS').namespace_id,'e1cc2ec83e1f45558dbd52cb020ba3c5');assert.equal(binding('LOGIN_GUARD').namespace_id,'0c5fda17cd6941169a525b33b014c71b');
            assert.equal(binding('MIGRATION_CANDIDATE_ENABLED').text,'true');assert.equal(binding('MIGRATION_USE_D1_CONTROL').text,'true');assert.equal(binding('MIGRATION_VERIFICATION_ENABLED').text,'true');assert.ok(secretNames.every(n=>binding(n)?.type==='secret_text'));
            assert.deepEqual((await api(base+'/schedules')).schedules,[]);assert.deepEqual(await api(base+'/subdomain'),{enabled:false,previews_enabled:false});
            const secrets=Object.fromEntries(secretNames.map(n=>[n,process.env[n]]));assert.ok(secretNames.every(n=>secrets[n]));
            let checked=false;
            for(let attempt=0;attempt<12&&!checked;attempt++){
              try {
                const proof=buildProof(secrets,'2048-new-production');
                const r=await fetch('https://mingcheng1024.cn/api/_migration/key-proof',{method:'POST',headers:{Authorization:proof.authorization},redirect:'error',signal:AbortSignal.timeout(20000)});
                if(r.status===200){const d=await r.json();assert.equal(d.nonce,proof.payload.nonce);assert.equal(d.audience,'2048-new-production');assert.equal(d.ok,true);assert.equal(d.passwordAlgorithmMatches,true);assert.equal(d.pbkdf2Iterations,100000);assert.ok(secretNames.every(n=>d.matches[n]===true));checked=true;}
              } catch {}
              if(!checked)await new Promise(r=>setTimeout(r,10000));
            }
            assert.equal(checked,true);
            for(const route of ['/', '/api/health', '/api/me']){
              const r=await fetch('https://mingcheng1024.cn'+route,{redirect:'error',signal:AbortSignal.timeout(20000)});assert.equal(r.status,503);assert.equal(r.headers.get('set-cookie'),null);
            }
            console.log(JSON.stringify({closed_candidate_deployed:true,version:versions[0].version_id,all_seven_original_keys_match:true,public_business_503:true,new_cron_off:true,correct_original_new_bindings:true,production_migration_ready:false,checked_at:new Date().toISOString()}));
          } catch {console.error('Closed NEW deployment validation stopped; no credential or response details logged');process.exitCode=1;}
          NODE
      - name: Verify retained history separately from old live snapshots and rearm original deadlines
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {CandidateClient} from './scripts/migration-candidate-client.mjs';
          try {
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/3232ebc7e9bb0199b92e3d70b07825af/workers/scripts/2048-challenge-platform/deployments',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},redirect:'error',signal:AbortSignal.timeout(20000)});assert.equal(r.status,200);const d=await r.json();assert.equal(d.success,true);const version=d.result.deployments[0].versions[0].version_id;
            const client=new CandidateClient(process.env.IMPORT_SIGNING_KEY,version);
            const json=async(route,method='GET',body)=>{const r=await client.request(route,method,body);assert.equal(r.status,200);return r.json();};
            let ready=false;for(let n=0;n<60&&!ready;n++){const r=await client.request('/api/health');ready=r.status===200;if(!ready)await new Promise(r=>setTimeout(r,5000));}assert.equal(ready,true);
            const login=await json('/api/auth/login','POST',{loginId:process.env.BOOTSTRAP_TEACHER_USERNAME,password:process.env.BOOTSTRAP_TEACHER_PASSWORD,locale:'zh-CN'});assert.equal(login.user.role,'teacher');
            const users=await json('/api/teacher/users?pageSize=1');assert.equal(users.total,1037);
            const oldRooms=await json('/api/teacher/rooms?status=ended&pageSize=100');const room=oldRooms.items.find(x=>!x.name.startsWith('MIG261011'));assert.ok(room);
            const result=(await json('/api/teacher/results/'+room.id)).result;assert.ok(result.players.length>0);assert.ok(result.players.every(x=>typeof x.final_board_json==='string'));
            const snapshot=await json('/api/teacher/rooms/'+room.id+'/live');assert.equal(snapshot.players.length,0);assert.equal(snapshot.roomId,'');
            const restored=await json('/api/teacher/_migration/rearm-waiting','POST',{});assert.equal(restored.ok,true);assert.equal(restored.rearmed,5);
            const history=await client.request('/api/teacher/results/export.csv');assert.equal(history.status,200);assert.ok((await history.text()).length>0);
            const teams=await json('/api/teacher/teams/export');assert.equal(teams.version,1);assert.ok(teams.teams.length>0);
            await json('/api/auth/logout','POST',{});client.clearCookies();
            const publicResponse=await fetch('https://mingcheng1024.cn/api/health',{redirect:'error',signal:AbortSignal.timeout(20000)});assert.equal(publicResponse.status,503);
            console.log(JSON.stringify({closed_final_data_acceptance_passed:true,version,original_student_count:1037,original_teacher_password_valid:true,original_history_results_and_final_boards_available:true,original_offline_team_export_available:true,old_live_runtime_transferred_to_new_namespace:false,old_live_snapshot_returns_empty_new_runtime:true,original_old_do_retained_for_traceability:true,original_waiting_rearmed:restored.rearmed,original_waiting_expired_by_original_deadline:restored.expired,public_business_open:false,checked_at:new Date().toISOString()}));
          }catch{console.error('Final CLOSED data acceptance stopped; no credential, response or record details logged');process.exitCode=1;}
          NODE
