name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit 2048 operation
        type: choice
        required: true
        options:
          [
            enable-source-verification,
            check-source-keys,
            check-new-keys,
            handoff-new-keys,
            staging,
            new-candidate,
            new-production,
            production-release,
          ]
      expected_commit:
        description: Reviewed full commit SHA
        type: string
        required: true
      approved_key_handoff:
        description: Separate approval to copy original keys to the closed NEW Worker
        type: boolean
        default: false
      approved_source_verification:
        description: Separate approval for the temporary OLD read-only verification wrapper
        type: boolean
        default: false
      approved_closed_candidate:
        description: Separate approval for signed operator acceptance while public NEW remains closed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 2048-explicit-deploy
  cancel-in-progress: false

jobs:
  runtime-key-acceptance:
    if: ${{ contains(fromJSON('["enable-source-verification","check-source-keys","check-new-keys","handoff-new-keys"]'), inputs.target) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pin reviewed code and every deployment target
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node --input-type=module -e 'if (!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_COMMIT ?? "") || process.env.EXPECTED_COMMIT !== process.env.GITHUB_SHA) process.exit(1)'
          node scripts/migration-deployment-targets.mjs
      - name: Check or hand off original encrypted repository secrets
        env:
          KEY_ACTION: ${{ inputs.target }}
          APPROVED_KEY_HANDOFF: ${{ inputs.approved_key_handoff }}
          APPROVED_SOURCE_VERIFICATION: ${{ inputs.approved_source_verification }}
          CF_2048_OLD_SOURCE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_2048_NEW_RUNTIME_SECRETS_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
          BOOTSTRAP_TEACHER_USERNAME: ${{ secrets.BOOTSTRAP_TEACHER_USERNAME }}
          BOOTSTRAP_TEACHER_PASSWORD: ${{ secrets.BOOTSTRAP_TEACHER_PASSWORD }}
          BOOTSTRAP_TEACHER_NAME: ${{ secrets.BOOTSTRAP_TEACHER_NAME }}
          INITIAL_STUDENT_PASSWORD: ${{ secrets.INITIAL_STUDENT_PASSWORD }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          PRACTICE_SIGNING_KEY: ${{ secrets.PRACTICE_SIGNING_KEY }}
          IMPORT_SIGNING_KEY: ${{ secrets.IMPORT_SIGNING_KEY }}
        run: |
          case "$KEY_ACTION" in
            enable-source-verification) node scripts/migration-source-key-verification.mjs ;;
            check-source-keys) node scripts/migration-runtime-key-handoff.mjs check-source ;;
            check-new-keys) node scripts/migration-runtime-key-handoff.mjs check-new ;;
            handoff-new-keys) node scripts/migration-runtime-key-handoff.mjs handoff-new ;;
            *) exit 1 ;;
          esac

  deploy-new-candidate:
    if: ${{ inputs.target == 'new-candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Require pinned code, prior evidence and separate operator-gate approval
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          APPROVED_CLOSED_CANDIDATE: ${{ inputs.approved_closed_candidate }}
        run: |
          node --input-type=module -e 'if (process.env.EXPECTED_COMMIT !== process.env.GITHUB_SHA || process.env.APPROVED_CLOSED_CANDIDATE !== "true") process.exit(1)'
          node scripts/migration-deployment-targets.mjs new-candidate
          node scripts/check-migration-targets.mjs --require-candidate-ready
      - run: npm ci
      - run: npm run build
      - name: Deploy closed NEW candidate; public traffic and cron stay blocked
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '3232ebc7e9bb0199b92e3d70b07825af'
        run: npx wrangler deploy --config wrangler.new-candidate.jsonc --keep-vars

  deploy-new-production:
    if: ${{ inputs.target == 'new-production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Require reviewed code and completed migration evidence
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node --input-type=module -e 'if (process.env.EXPECTED_COMMIT !== process.env.GITHUB_SHA) process.exit(1)'
          node scripts/migration-deployment-targets.mjs new-production
          node scripts/check-migration-targets.mjs --require-ready
      - run: npm ci
      - run: npm run build
      - name: Deploy only NEW production; never migrate or replace original secrets here
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '3232ebc7e9bb0199b92e3d70b07825af'
        run: npm run deploy -- --message "Production ${GITHUB_SHA}" --tag "${GITHUB_SHA}"

  routine-production-release:
    if: ${{ inputs.target == 'production-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CLOUDFLARE_ACCOUNT_ID: '3232ebc7e9bb0199b92e3d70b07825af'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require current main CI, completed cutover and unchanged live production
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
        run: node scripts/production-release.mjs preflight "$RUNNER_TEMP/2048-production-release.json"
      - name: Upload one candidate; preserve vars and secrets without database migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/2048-candidate.jsonl
        run: npx wrangler versions upload --config wrangler.new-production.jsonc --outdir .wrangler/production-bundle --keep-vars --message "Production ${GITHUB_SHA}" --tag "${GITHUB_SHA}"
      - name: Read back candidate bindings and security settings before traffic
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
        run: node scripts/production-release.mjs candidate "$RUNNER_TEMP/2048-production-release.json" "$RUNNER_TEMP/2048-candidate.jsonl"
      - name: Send traffic only to the verified candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version_id }}
        run: npx wrangler versions deploy "${CANDIDATE_VERSION}@100%" --config wrangler.new-production.jsonc --yes --message "Production ${GITHUB_SHA}"
      - name: Verify main, active version, preserved bindings and actual published assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_2048_NEW_PRODUCTION_DEPLOY_TOKEN }}
        run: node scripts/production-release.mjs verify "$RUNNER_TEMP/2048-production-release.json"
      - run: npx playwright install --with-deps chromium webkit
      - name: Real anonymous production Cookie and session checks; no account login
        run: npx playwright test --config playwright.production.config.ts
      - name: Actual production assets with isolated mocked business APIs
        run: npx playwright test --config playwright.production-mock.config.ts --project desktop-en --project ipad-portrait-zh
      - name: Save release evidence and diagnostics without credentials or traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-release-evidence
          path: |
            ${{ runner.temp }}/2048-production-release.json
            test-results/production-anonymous
            test-results/production-mock
          if-no-files-found: ignore
          retention-days: 7

  deploy-preview:
    name: Deploy preview
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require OLD staging and reviewed commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node --input-type=module -e 'if (process.env.EXPECTED_COMMIT !== process.env.GITHUB_SHA) process.exit(1)'
          node scripts/migration-deployment-targets.mjs staging
      - run: npm run cf-typegen
      - run: npm run build
      - name: Check preview package
        run: npx wrangler deploy --config wrangler.staging.jsonc --dry-run --outdir .wrangler-dry-run/staging
      - name: Apply staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '8b0d70250211aa10d89e20605a1c7e5e'
        run: npx wrangler d1 migrations apply DB --config wrangler.staging.jsonc --remote
      - name: Deploy staging Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '8b0d70250211aa10d89e20605a1c7e5e'
        run: npx wrangler deploy --config wrangler.staging.jsonc --keep-vars --message "Preview ${GITHUB_SHA}"
