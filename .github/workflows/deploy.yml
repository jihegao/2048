name: Deploy to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 2048-explicit-deploy
  cancel-in-progress: false

jobs:
  migration-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Keep production deployment held until verified migration release
        run: |
          echo "2048 migration preparation: OLD remains serving. Production deployment is held until fixed-account release gates pass." >&2
          exit 1
