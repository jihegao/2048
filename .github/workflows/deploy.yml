name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && 'staging' || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOOTSTRAP_TEACHER_USERNAME: ${{ secrets.BOOTSTRAP_TEACHER_USERNAME }}
      BOOTSTRAP_TEACHER_PASSWORD: ${{ secrets.BOOTSTRAP_TEACHER_PASSWORD }}
      BOOTSTRAP_TEACHER_NAME: ${{ secrets.BOOTSTRAP_TEACHER_NAME }}
      INITIAL_STUDENT_PASSWORD: ${{ secrets.INITIAL_STUDENT_PASSWORD }}
      PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
      PRACTICE_SIGNING_KEY: ${{ secrets.PRACTICE_SIGNING_KEY }}
      IMPORT_SIGNING_KEY: ${{ secrets.IMPORT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run build
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
      - name: Deploy Worker and static assets
        run: npm run deploy
      - name: Synchronize runtime secrets
        run: node scripts/publish-cloudflare-secrets.mjs

  deploy-preview:
    name: Deploy preview
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run build
      - name: Check preview package
        run: npx wrangler deploy --env staging --dry-run --outdir .wrangler-dry-run/staging
      - name: Apply staging D1 migrations
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy staging Worker and static assets
        run: npx wrangler deploy --env staging --keep-vars --message "Preview ${GITHUB_SHA}"
